# npx prettier --write compose.yaml --tab-width 4
services:
    web:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: grow-16-interview-prep

        ports:
            - "5173:5173"

        develop:
            watch:
                # Sync source code changes into the container
                # This allows Vite HMR to detect changes
                - path: .
                  action: sync
                  target: /app
                  ignore:
                      - node_modules/
                      - .git/

                # Rebuild the image when dependencies change
                - path: ./package.json
                  action: rebuild

                - path: ./package-lock.json
                  action: rebuild

        environment:
            - NODE_ENV=development

        restart: unless-stopped
